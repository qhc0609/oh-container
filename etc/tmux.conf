# tmux 配置 —— 由 oh-container 部署到容器内 /root/.tmux.conf
#
# 目标只有一个：让「往上翻看历史」不需要背快捷键。
# 历史保存在容器里的 tmux 进程中，和宿主终端（conhost / Windows Terminal）
# 的缓冲区无关——hdc 会自己重画固定尺寸的屏幕，宿主的回滚区里根本没有这些行。

set -g history-limit 50000
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g default-terminal "xterm-256color"
set -g mode-keys vi

# ★ 最关键的一行，别删。
# claude 启动时会发 ESC[?1049h 切到「备用屏幕」（alt screen）。
# 备用屏幕按设计就是一块临时画布：切走时整块丢弃，不产生任何回滚历史。
# 只要 tmux 允许这个切换，claude 的输出就一行都进不了 history，
# history-limit 调到 5 万也一样——你往上翻看到的永远是空的，
# 屏幕上永远只有最后那一屏（20 行窗口里大约就是十几个「1」）。
# 关掉之后 tmux 直接忽略这个请求，claude 画在主屏幕上，
# 滚出屏幕顶端的行会正常进入 history，翻页才有东西可翻。
# 代价：退出 claude 后画面不会被还原（内容留在屏幕上），这个可以接受。
set -g alternate-screen off

# 状态栏：把翻页方式直接写在上面，省得记
set -g status-style "bg=colour238,fg=colour250"
set -g status-left ""
set -g status-right "#[fg=colour114]Ctrl+B [ 翻页#[fg=colour244] | PageUp | q 退出 | #[fg=colour250]#{session_name} "
set -g status-interval 1

set -g base-index 1
setw -g pane-base-index 1

# PageUp 直接进翻页模式并往上滚，不用先按 Ctrl+B
bind -n PPage copy-mode -u
# 翻页模式里 PageUp/PageDown 继续翻，q 退出
bind -T copy-mode-vi PPage send-keys -X page-up
bind -T copy-mode-vi NPage send-keys -X page-down

# 鼠标滚轮（Windows Terminal 等支持鼠标上报的终端有效；conhost 用 PageUp）
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -eu'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"
