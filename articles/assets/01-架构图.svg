<svg viewBox="0 0 680 220" width="680" height="220" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>断网电脑通过手机调用云端大模型的链路</title>
  <desc>断网的电脑经 USB 线连到手机里的小房间，容器中的 AI 客户端只做转发，由手机网络请求云端 DeepSeek，答案原路返回电脑屏幕。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <g>
    <rect x="40" y="60" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="110" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">断网的电脑</text>
    <text x="110" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">打字 + 显示</text>
  </g>

  <g>
    <rect x="240" y="60" width="160" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="320" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#185FA5">手机里的小房间</text>
    <text x="320" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#185FA5">AI 客户端只转发</text>
  </g>

  <g>
    <rect x="460" y="60" width="150" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text x="535" y="80" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">云端 DeepSeek</text>
    <text x="535" y="98" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">V4.1 Flash</text>
  </g>

  <path d="M182 88 L236 88" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="209" y="72" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">USB 线</text>

  <path d="M402 88 L456 88" fill="none" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="429" y="72" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">手机网络</text>

  <path d="M535 118 L535 146 L110 146 L110 120" fill="none" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="322" y="168" text-anchor="middle" dominant-baseline="central" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="400" fill="#5F5E5A">答案原路返回 —— 那台电脑全程一次网都没连</text>
</svg>
